[project]
name = "spu-dental-backend"
version = "0.1.0"
description = "SPU Dental Clinic System: API, dashboard and background jobs"
requires-python = "==3.13.*"
# Exact versions only. Change a pin in its own pull request and record why in docs/decisions.md.
dependencies = [
    "Django==5.2.19",
    "djangorestframework==3.18.3",
    "djangorestframework-simplejwt==5.5.1",
    "drf-spectacular==0.30.0",
    "django-filter==26.2",
    "django-unfold==0.110.1",
    "django-import-export==4.4.6",
    "openpyxl==3.1.5",
    "django-simple-history==3.13.0",
    "django-storages==1.14.6",
    "boto3==1.44.8",
    "Pillow==13.0.0",
    "celery==5.7.0",
    "django-celery-beat==2.9.0",
    "firebase-admin==7.8.0",
    "psycopg[binary]==3.3.9",
    "redis==8.1.0",
    "gunicorn==27.0.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-django==4.14.0",
    "factory-boy==3.3.3",
    "ruff==0.17.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "SIM", "C4", "PT", "RUF"]
# Django's Meta options, serializer fields and admin options are mutable class attributes
# by design; RUF012 would flag every model and view.
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["config", "apps"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests", "apps"]
addopts = "-ra --strict-markers"

[tool.ruff.lint.per-file-ignores]
# Environment settings files extend base with star imports by design.
"config/settings/*.py" = ["F403", "F405"]
